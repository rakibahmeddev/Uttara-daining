name: Auto Order Daily Cron

on:
  schedule:
    # Runs at 9:00 PM and 10:00 PM Bangladesh Time (UTC+6)
    - cron: '0 15,16 * * *'
    # Runs at 10:58 PM Bangladesh Time (UTC+6)
    - cron: '58 16 * * *'
  
  # Allow manual triggering from the GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  run-auto-order:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Dependencies
        working-directory: ./functions
        run: npm ci || npm install
        
      - name: Run Auto Order Script
        working-directory: ./functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node autoOrderCron.js
